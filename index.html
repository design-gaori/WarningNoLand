<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>땅 없음 주의 구역</title>
    <!-- 사이트 아이콘(탭·즐겨찾기): 투명 배경 + 안전콘 (icon/safety-cone.svg를 정사각형으로). PNG는 SVG 아이콘을 못 쓰는 브라우저용. apple-touch-icon(iPhone 홈 화면)은 투명하면 검게 나와서 흰 배경 유지 -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- 링크 미리보기(카카오톡·메신저 등). 썸네일 = public/og-image.jpg (메인 화면 캡처, 1200×630). 이미지 주소는 절대 주소여야 함 -->
    <meta name="description" content="안전콘으로 땅을 이어 주는 퍼즐 게임" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="땅 없음 주의 구역" />
    <meta property="og:description" content="안전콘으로 땅을 이어 주는 퍼즐 게임" />
    <meta property="og:url" content="https://design-gaori.github.io/WarningNoLand/" />
    <meta property="og:image" content="https://design-gaori.github.io/WarningNoLand/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
